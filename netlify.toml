[build]
  # 0) "verificar-integracion.js" corta el build si index.html se publico
  #    sin el sistema de seguridad/accesos enganchado (paso a esto una vez,
  #    en silencio, ver claude/auditoria-seguridad-cancionero.md).
  # 1) "hashes" recalcula HASHES_ESPERADOS en 02-anti-clonacion.js con el
  #    contenido real de index.html/sw.js/canciones.js/manifest.json de este
  #    mismo build, asi nunca quedan viejos (antes se mantenian a mano).
  # 2) "ofuscar" ofusca los 3 scripts de la capa de seguridad (sello,
  #    anti-clonacion, anti-manipulacion), sin tocar el resto del sitio.
  # El orden importa: la ofuscacion lee 02-anti-clonacion.js, asi que los
  # hashes tienen que estar inyectados antes. El codigo fuente legible queda
  # en git; solo lo que se sirve al usuario sale ofuscado. Ver seguridad/06-build/.
  command = "cd seguridad/06-build && npm install && node verificar-integracion.js && npm run hashes && npm run ofuscar && cp dist/01-sello-marca-agua.js ../01-sello-marca-agua.js && cp dist/02-anti-clonacion.js ../02-anti-clonacion.js && cp dist/03-anti-manipulacion.js ../03-anti-manipulacion.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://zhxtoublmvrghmnpwxoj.supabase.co; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# La app real usa scripts inline y atributos onclick en todo el HTML, por eso
# script-src necesita 'unsafe-inline' (ver seguridad/05-cabeceras-http.md,
# seccion "Nota sobre CSP y unsafe-inline"). connect-src incluye el dominio
# de la funcion validate-key en Supabase porque si no, el CSP bloquearia el
# login.

# Oculta archivos internos que NO son parte de la app (documentacion, scripts de
# administracion, codigo y migraciones de Supabase, atajos .bat/.vbs). Todos
# viven en la misma carpeta que se publica, asi que sin estas reglas quedarian
# abiertos al publico. IMPORTANTE: cada regla lleva force = true; sin eso Netlify
# NO aplica una redireccion cuando el archivo existe (asi se filtraron hasta el
# 18/11/2026). Las rutas van completas (sin comodin en medio) para que no haya
# dudas. Los scripts 01, 02 y 03 de /seguridad/ SI se sirven (los usa la app).

[[redirects]]
  from = "/ADMIN.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

